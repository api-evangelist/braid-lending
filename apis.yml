aid: braid-lending
name: Pylon (formerly Braid Lending)
description: >-
  Pylon (formerly Braid Lending) is an AI-native mortgage infrastructure company
  founded in 2022 and headquartered in New York, New York, backed by investors
  including 500 Global and Citi. Pylon operates as "America's mortgage rails," an
  API-first, MCP-native platform that lets brokers, fintechs, lenders, and banks
  build and automate mortgage origination end to end — from application through
  underwriting, decisioning, compliance, and capital markets settlement. Every
  aspect of mortgage fulfillment is powered by APIs, complemented by a white-label
  "Elements" UI component library for embedding fully digital, autonomous mortgage
  experiences. The public developer surface (API reference, integration guides, and
  a live playground) is gated behind a developer-access request form, so no public
  OpenAPI, SDKs, or hosted docs were discoverable during enrichment.
